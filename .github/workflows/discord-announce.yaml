# Announces a promoted xOllama release on Discord, as mann1x/osync does.
#
# xollama-release.yaml publishes every release as a pre-release; step 8 of
# docs/protocols/RELEASE.md promotes it with `gh release edit --prerelease=false`.
# The `released` activity fires on exactly that promotion (and on a release
# published as full from the start), never for a pre-release, so dev builds and
# unpromoted tags stay quiet. It does not fire for a release the Actions
# GITHUB_TOKEN edits, which is why promotion stays a manual step.
#
# Run it by hand (`gh workflow run discord-announce.yaml -f tag=<tag>`) to
# re-announce a tag. A Discord failure is reported but fails nothing.
name: discord-announce

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to announce
        required: true

permissions:
  contents: read

jobs:
  announce:
    if: github.repository == 'mann1x/xollama'
    runs-on: ubuntu-latest
    steps:
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.TECH_CORNER_DISCOWH }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::Secret TECH_CORNER_DISCOWH is not set; skipping the Discord announcement"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 - <<'PY' > discord.json
          import json, os
          tag = os.environ["TAG"]
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"
          notes = open("notes.md", encoding="utf-8").read().strip()
          limit = 3800  # Discord embed descriptions are limited to 4096 characters
          if len(notes) > limit:
              notes = notes[:limit].rsplit("\n", 1)[0] + f"\n\n… [full release notes]({url})"
          print(json.dumps({
              "username": "xOllama",
              "embeds": [{
                  "title": f"xOllama {tag} released",
                  "url": url,
                  "description": notes,
                  "color": 0x58B9FF,
              }],
          }))
          PY
          curl -fsS --retry 3 -H "Content-Type: application/json" -d @discord.json "$DISCORD_WEBHOOK"
          echo "Announced $TAG on Discord" >> "$GITHUB_STEP_SUMMARY"
