# xOllama releases. The procedure this implements is docs/protocols/RELEASE.md;
# read that first — this file is the mechanism, not the rules.
#
# A release is a pull request from dev into main titled `release: v<version>`,
# whose body is the release notes. A version is one of three forms, all on the
# upstream release dev is based on (RELEASE.md, "Versions and tags"):
#   v<upstream>-rc.<k>.xollama   a release candidate, never promoted
#   v<upstream>-xollama          the release: the tree of its last candidate
#   v<upstream>-xollama.<n>      a re-release on the same upstream
# Plain semver orders them in exactly that order, which is the order the
# desktop updater uses. While the PR is open this workflow only
# checks it. When it is merged (with a merge commit), it builds on
# GitHub-hosted runners, fills a draft release, and publishes it as a
# pre-release — which is also what creates the tag, on the merge commit.
# Promotion to stable is a separate, manual `gh release edit`.
#
# A manual run (workflow_dispatch, input `pr`) re-runs a merged PR's release,
# or — against an OPEN PR — builds its head into a draft that nobody but the
# repository's writers can see: the dry run.
#
# Nothing native is compiled here. The CPU runtime is a pinned artifact built
# once by xollama-runtime.yaml (llama/runtime-pin.txt), the CUDA and Vulkan
# backends come from upstream's release of the same base, guarded by
# LLAMA_CPP_VERSION, and the opencoti engine comes from llm/engine/pin,
# SHA-256 enforced. So the payload -- and the payload id the delta update keys
# on -- changes only when one of those three pins moves. Only the Go binaries,
# the tray app and the installers are built.
#
# macOS is the exception, in the `macos` job: its runtime (llama.cpp on Metal
# and MLX) has no pinned artifact, so scripts/build_darwin.sh compiles it on
# the runner, exactly as the Mac mini built every release before this job
# existed. The app is signed with the Developer ID certificate and notarized
# with the App Store Connect key held in the repository's secrets.
#
# No third-party actions, not even actions/checkout: git and gh are on every
# hosted image, and a job that cannot run because an action was not allowed
# queues silently. Nothing from the PR (title, body) is ever interpolated into
# a script; it is read through gh into variables.
name: xollama release

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Release PR number (open = draft dry run, merged = the real release)'
        required: true

permissions:
  contents: write
  pull-requests: read
  # publish starts docker-release.yaml on the tag it has just created.
  actions: write

concurrency:
  group: xollama-release-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # No GOTOOLCHAIN here: `plan` names one exact toolchain and both build jobs
  # use it (see "the Go toolchain" below). `auto` let each runner decide, and
  # v0.34.2-xollama.1 shipped go1.26.0 on Windows and go1.27.1 on Linux.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      gotoolchain: ${{ steps.plan.outputs.gotoolchain }}
      gomod: ${{ steps.plan.outputs.gomod }}
      mode: ${{ steps.plan.outputs.mode }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      kind: ${{ steps.plan.outputs.kind }}
      upstream: ${{ steps.plan.outputs.upstream }}
      engine: ${{ steps.plan.outputs.engine }}
      enginearch: ${{ steps.plan.outputs.enginearch }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      runtime_asset: ${{ steps.plan.outputs.runtime_asset }}
      runtime_sha256: ${{ steps.plan.outputs.runtime_sha256 }}
      linux_runtime_tag: ${{ steps.plan.outputs.linux_runtime_tag }}
    steps:
      - name: plan
        id: plan
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          fail() { echo "::error::$*"; exit 1; }
          out go false

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then pr=$EVENT_PR; else pr=$INPUT_PR; fi
          [[ "$pr" =~ ^[0-9]+$ ]] || fail "pr must be a number, got '$pr'"
          out pr "$pr"

          gh pr view "$pr" --json title,body,state,baseRefName,headRefOid,mergeCommit > pr.json
          title=$(jq -r .title pr.json)
          state=$(jq -r .state pr.json)
          re='^release: v([0-9]+\.[0-9]+\.[0-9]+)-(rc\.([1-9][0-9]*)\.xollama|xollama(\.([1-9][0-9]*))?)$'
          if ! [[ "$title" =~ $re ]]; then
            # Any other PR into main is not a release, and that is not an error.
            [ "$GITHUB_EVENT_NAME" = pull_request ] && { echo "not a release PR: $title"; exit 0; }
            fail "PR #$pr is not a release PR: its title must be 'release: v<upstream>-rc.<k>.xollama', 'release: v<upstream>-xollama' or 'release: v<upstream>-xollama.<n>', got '$title'"
          fi
          upstream=${BASH_REMATCH[1]}
          version="${upstream}-${BASH_REMATCH[2]}"
          if [ -n "${BASH_REMATCH[3]}" ]; then kind=rc
          elif [ -z "${BASH_REMATCH[5]}" ]; then kind=release
          else kind=rerelease; fi
          tag="v$version"
          out version "$version"; out tag "$tag"; out upstream "$upstream"; out kind "$kind"
          # Every tag this repository publishes as an xOllama release, old and new.
          tags='^v[0-9]+\.[0-9]+\.[0-9]+-(rc\.[1-9][0-9]*\.xollama|xollama(\.[1-9][0-9]*)?)$'

          # check  : PR open, event-driven — validate only, build nothing
          # draft  : manual run on an open PR — build the head into a draft
          # release: PR merged — build the merge commit and publish
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ "$EVENT_ACTION" != closed ]; then mode=check
            elif [ "$state" = MERGED ]; then mode=release
            else echo "release PR closed without merging; nothing to do"; exit 0; fi
          else
            case "$state" in
              OPEN) mode=draft ;;
              MERGED) mode=release ;;
              *) fail "PR #$pr is $state; only an open PR (dry run) or a merged one (release) can be built" ;;
            esac
          fi
          out mode "$mode"
          if [ "$mode" = release ]; then sha=$(jq -r .mergeCommit.oid pr.json); else sha=$(jq -r .headRefOid pr.json); fi
          out sha "$sha"
          echo "PR #$pr: $mode $tag at $sha"

          [ "$(jq -r .baseRefName pr.json)" = main ] || fail "a release PR targets main"
          [ -n "$(jq -r '.body // ""' pr.json | tr -d '[:space:]')" ] \
            || fail "the PR body is the release notes, and it is empty; a release with no notes does not build"

          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" repo
          cd repo
          git fetch --quiet origin "$sha"

          # A squash or rebase merge leaves main without dev's history, and the
          # next upstream sync without a merge-base. Refuse to release it.
          if [ "$mode" = release ]; then
            git merge-base --is-ancestor "$(jq -r .headRefOid ../pr.json)" "$sha" \
              || fail "PR #$pr was not merged with a merge commit; see RELEASE.md rule 4"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            fail "tag $tag already exists; a published tag is never reused — bump <n>"
          fi
          if published=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            [ "$published" = true ] || fail "release $tag is already published"
          fi
          # Newer than everything published, by the order the updater uses.
          newest=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' \
            | { grep -E "$tags" || true; } | sed 's/^v//' | { cat; echo "$version"; } | sort -V | tail -1)
          [ "$newest" = "$version" ] || fail "$version is not newer than the published $newest"

          # The release ships the tree its last candidate was checked on. The
          # version is stamped into the binaries, so the release is a rebuild;
          # the same tree is what lets it take the short check (RELEASE.md step 7).
          if [ "$kind" = release ]; then
            rc=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' \
              | { grep -E "^v${upstream//./\\.}-rc\.[1-9][0-9]*\.xollama$" || true; } | sort -V | tail -1)
            [ -n "$rc" ] || fail "$tag has no published candidate; release v$upstream-rc.1.xollama first"
            git fetch --quiet origin "refs/tags/$rc:refs/tags/$rc"
            [ "$(git rev-parse "$sha^{tree}")" = "$(git rev-parse "$rc^{tree}")" ] \
              || fail "$tag must ship the tree of $rc, its last candidate, and $sha differs; release the change as the next candidate"
            echo "tree matches $rc"
          fi

          # The CUDA and Vulkan backends are borrowed from upstream's release of
          # the same base, which is only sound when both sides built the same
          # llama.cpp. When dev has moved past it, fail rather than ship a pair
          # that merely loads.
          ours=$(git show "$sha:LLAMA_CPP_VERSION" | tr -d '[:space:]')
          theirs=$(gh api "repos/ollama/ollama/contents/LLAMA_CPP_VERSION?ref=v$upstream" --jq .content | base64 -d | tr -d '[:space:]') \
            || fail "ollama/ollama has no tag v$upstream to take the GPU backends from"
          [ "$ours" = "$theirs" ] \
            || fail "LLAMA_CPP_VERSION is $ours here but $theirs in upstream v$upstream; the GPU backends cannot be borrowed"
          gh release view "v$upstream" --repo ollama/ollama --json assets --jq '.assets[].name' | grep -qx ollama-windows-amd64.zip \
            || fail "upstream v$upstream publishes no ollama-windows-amd64.zip"
          echo "llama.cpp $ours on both sides; GPU backends from upstream v$upstream"

          # The CPU runtime is a pinned artifact (xollama-runtime.yaml), so the
          # payload -- and with it the payload id the delta update keys on --
          # only changes when a pin moves. Refuse a pin built from other inputs
          # than this commit has: a llama/compat change must not ship on a
          # runtime that predates it.
          pin=$(git show "$sha:llama/runtime-pin.txt") \
            || fail "no llama/runtime-pin.txt at $sha; run xollama-runtime.yaml and commit the pin (RELEASE.md)"
          field() { awk -v k="$1" '$1==k {print $2}' <<< "$pin"; }
          rtag=$(field tag); rasset=$(field asset); rsum=$(field sha256); rinputs=$(field inputs)
          now=$(git ls-tree -r "$sha" -- LLAMA_CPP_VERSION llama/server llama/compat | sha256sum | cut -c1-64)
          [ "$now" = "$rinputs" ] \
            || fail "llama/runtime-pin.txt was built from inputs $rinputs, but this commit's are $now; run xollama-runtime.yaml on it and commit the new pin (RELEASE.md, 'Moving the runtime pin')"
          gh release view "$rtag" --json assets --jq '.assets[].name' | grep -qx "$rasset" \
            || fail "the pinned runtime $rtag/$rasset is not published"
          out runtime_tag "$rtag"; out runtime_asset "$rasset"; out runtime_sha256 "$rsum"
          echo "CPU runtime: $rtag (inputs match)"

          # The container image is built from this tag once it exists
          # (docker-release.yaml, started by publish), from the two Linux
          # runtime pins. Refuse here what would only fail there, after the
          # release is out: a pin without its runtime, built from other llama
          # inputs, not published, or the two architectures on different fork
          # releases. The fork's llama/compat/README.md is not a build input,
          # so the digest leaves it out, as scripts/docker-assemble.sh does.
          lnow=$(git ls-tree -r "$sha" -- LLAMA_CPP_VERSION llama/server llama/compat \
            | grep -v '[[:space:]]llama/compat/README\.md$' | sha256sum | cut -c1-64)
          ltags=
          for lf in llama/runtime-pin-linux.txt llama/runtime-pin-linux-arm64.txt; do
            lpin=$(git show "$sha:$lf") || fail "no $lf at $sha; the image cannot be assembled"
            lfield() { awk -v k="$1" '$1==k {print $2; exit}' <<< "$lpin"; }
            lrepo=$(lfield repo); ltag=$(lfield tag); lasset=$(lfield asset); linputs=$(lfield inputs)
            [ -n "$lrepo" ] && [ -n "$ltag" ] && [ -n "$lasset" ] && [ -n "$(lfield sha256)" ] \
              || fail "$lf names no runtime; move it to the fork's release (FORK-SYNC.md)"
            [ "$lnow" = "$linputs" ] \
              || fail "$lf was built from inputs $linputs, but this commit's are $lnow; move both Linux runtime pins to the fork release built from them"
            gh release view "$ltag" --repo "$lrepo" --json assets --jq '.assets[].name' | grep -qx "$lasset" \
              || fail "$lf: $lrepo $ltag publishes no $lasset"
            [ "$(lfield upstream)" = "v$upstream" ] \
              || fail "$lf takes its GPU backends from $(lfield upstream), this release is on v$upstream"
            ltags="$ltags $ltag"
          done
          [ "$(tr ' ' '\n' <<< "$ltags" | sort -u | grep -c .)" = 1 ] \
            || fail "the two Linux runtime pins name different fork releases ($ltags); they move together"
          out linux_runtime_tag "${ltags##* }"
          echo "Linux CPU runtimes: fork ${ltags##* }, amd64 and arm64 (inputs match)"

          # The Go toolchain: upstream's LINE, the newest PATCH. go.mod stays
          # upstream's (`go 1.26.0`, what upstream builds its releases with);
          # the build takes the newest go<major.minor>.N, because 1.26.0 carries
          # standard-library fixes that shipped in 1.26.1-1.26.6. When upstream
          # moves go.mod to a new minor, this follows it with no edit here.
          gomod=$(git show "$sha:go.mod" | awk '$1=="go" {print $2; exit}')
          line=$(cut -d. -f1,2 <<< "$gomod")
          toolchain=$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' \
            | jq -r --arg l "go$line" '[.[] | select(.stable) | .version | select(. == $l or startswith($l + "."))] | first // empty')
          [ -n "$toolchain" ] || fail "no stable Go release found on the go$line line (go.mod says go $gomod)"
          out gotoolchain "$toolchain"; out gomod "$gomod"
          echo "Go: $toolchain (go.mod: go $gomod)"

          # The engine is one file for every platform (`file any bin`), with
          # a row of its own for Windows under the .exe name it needs. Its
          # pin is the one our index names (llm/engine/pin, pin format 2).
          epin=$(git show "$sha:llm/engine/pin/index.txt" | awk '$1=="engine" {n=split($2,a,"/"); print a[n]}')
          [ -n "$epin" ] || fail "llm/engine/pin/index.txt names no engine pin at $sha"
          if git show "$sha:llm/engine/pin/$epin" | grep -Eq '^[[:space:]]*file[[:space:]]+(win-x86_64|any)[[:space:]]+bin[[:space:]]'; then
            out engine yes; out enginearch win-x86_64; echo "opencoti: the pin carries the engine for Windows"
          else
            out engine no; echo "opencoti: no Windows row at this pin; the installer carries llama.cpp only"
          fi

          [ "$mode" = check ] && { echo "checks passed; merge to release"; exit 0; }

          # The draft is what the build jobs fill. Nothing is visible to the
          # updater until publish turns it into a pre-release.
          if [ "${published:-}" = true ]; then gh release delete "$tag" --yes; fi
          jq -r .body ../pr.json > notes.md
          gh release create "$tag" --draft --prerelease --target "$sha" \
            --title "xOllama $version" --notes-file notes.md
          out go true

  windows:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM: ${{ needs.plan.outputs.upstream }}
      ENGINE: ${{ needs.plan.outputs.engine }}
      ENGINE_ARCH: ${{ needs.plan.outputs.enginearch }}
      RUNTIME_TAG: ${{ needs.plan.outputs.runtime_tag }}
      RUNTIME_ASSET: ${{ needs.plan.outputs.runtime_asset }}
      RUNTIME_SHA256: ${{ needs.plan.outputs.runtime_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        run: |
          # LF, not CRLF: llama/compat/*.patch are LF and `git apply` will not
          # match them against a CRLF checkout.
          git init -q repo && cd repo
          git config core.autocrlf false && git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      # Downloaded, not built: see xollama-runtime.yaml for why. plan has
      # already proved the pin matches this commit's llama/ inputs.
      - name: take the pinned CPU runtime
        working-directory: repo
        run: |
          set -euo pipefail
          gh release download "$RUNTIME_TAG" --pattern "$RUNTIME_ASSET" --dir runtime-pin --clobber
          got=$(sha256sum "runtime-pin/$RUNTIME_ASSET" | cut -c1-64)
          [ "$got" = "$RUNTIME_SHA256" ] || { echo "::error::$RUNTIME_ASSET is $got, the pin says $RUNTIME_SHA256"; exit 1; }
          mkdir -p dist/windows-amd64/lib/ollama
          # Expand-Archive, not unzip: Git Bash on the runner does not promise one.
          pwsh -NoProfile -Command "Expand-Archive -Path 'runtime-pin\\$RUNTIME_ASSET' -DestinationPath 'dist\\windows-amd64\\lib\\ollama' -Force"
          test -f dist/windows-amd64/lib/ollama/llama-server.exe
          ./dist/windows-amd64/lib/ollama/llama-server.exe --version

      - name: take the GPU backends from upstream v${{ needs.plan.outputs.upstream }}
        shell: pwsh
        working-directory: repo
        run: |
          # plan already proved upstream built the same llama.cpp.
          $zip = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
          & gh release download "v$env:UPSTREAM" --repo ollama/ollama --pattern ollama-windows-amd64.zip --output $zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          # System32 tar is bsdtar and reads zip; Git's GNU tar does not.
          $tar = "$env:SystemRoot\System32\tar.exe"
          $x = Join-Path $env:RUNNER_TEMP 'upstream'
          New-Item -ItemType Directory -Force $x | Out-Null
          & $tar -xf $zip -C $x lib/ollama/cuda_v13 lib/ollama/vulkan
          if ($LASTEXITCODE -ne 0) { throw "upstream's zip has no lib/ollama/cuda_v13 or lib/ollama/vulkan" }
          foreach ($d in @('cuda_v13', 'vulkan')) {
            $src = Join-Path $x "lib\ollama\$d"
            if (-not (Get-ChildItem $src -Filter 'ggml-*.dll')) { throw "no ggml backend in upstream $d" }
            Copy-Item -Recurse -Force $src 'dist\windows-amd64\lib\ollama\'
          }
          Remove-Item -Force $zip

      # Into lib/ollama/engines, not beside llama-server.exe: that directory
      # is the engine's own, and ggml's loader in llama-server.exe looks in
      # its own for a ggml-cuda.dll (cmake/opencoti-engine.cmake).
      # The one fetch stages everything the pin names for Windows beside the
      # engine under its published name: the engine, its CUDA and Vulkan
      # DLLs, the media DLLs and their licence texts. The installer takes
      # lib\ollama recursively and payloadId hashes every file under it, so
      # they ship and a changed one is a payload change.
      - name: stage the opencoti engine
        if: env.ENGINE == 'yes'
        working-directory: repo
        run: |
          cmake -DPIN_DIR=llm/engine/pin -DARCH=$ENGINE_ARCH -DMANIFEST=engine-manifest.txt \
            -DDEST_DIR=dist/windows-amd64/lib/ollama/engines -P cmake/opencoti-fetch.cmake
          [ -s engine-manifest.txt ] || { echo "::error::the fetch staged nothing"; exit 1; }
          while read -r comp version kind name sum bytes; do
            f="dist/windows-amd64/lib/ollama/engines/$name"
            [ "$(sha256sum "$f" 2>/dev/null | cut -c1-64)" = "$sum" ] \
              || { echo "::error::$comp $kind $name is not staged beside the engine as the pin names it"; exit 1; }
            echo "$comp $version $kind: $name"
          done < engine-manifest.txt
          rm engine-manifest.txt

      - name: payload
        working-directory: repo
        run: |
          find dist/windows-amd64/lib/ollama -type f -printf '%P  %s\n' | sort
          du -sh dist/windows-amd64/lib/ollama

      # -s -w and a static link: an unstripped cgo PE will not load, and a
      # dynamic one imports libwinpthread-1.dll, which a clean Windows lacks.
      - name: build xollama.exe
        working-directory: repo
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -extldflags=-static -X=github.com/ollama/ollama/version.Version=$VERSION -X=github.com/ollama/ollama/server.mode=release" \
            -o dist/windows-amd64/xollama.exe .
          ./dist/windows-amd64/xollama.exe --version 2>&1 | tee version.txt
          grep -q "$VERSION" version.txt || { echo "::error::xollama.exe does not report $VERSION"; exit 1; }

      # app/ui/app.go embeds app/dist, so the UI is built before the app.
      - name: build the web ui
        working-directory: repo/app/ui/app
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - name: build the tray app
        working-directory: repo
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -extldflags=-static -X=github.com/ollama/ollama/app/version.Version=$VERSION" \
            -o dist/windows-xollama-app-amd64.exe ./app/cmd/app/

      - name: built with the planned Go toolchain
        working-directory: repo
        env:
          WANT: ${{ needs.plan.outputs.gotoolchain }}
          GOTOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
        run: |
          for exe in dist/windows-amd64/xollama.exe dist/windows-xollama-app-amd64.exe; do
            got=$(go version "$exe" | awk '{print $NF}')
            echo "$exe: $got"
            [ "$got" = "$WANT" ] || { echo "::error::$exe was built with $got, not $WANT"; exit 1; }
          done

      - name: no third-party DLL imports
        working-directory: repo
        run: |
          bad=0
          for exe in dist/windows-amd64/xollama.exe dist/windows-xollama-app-amd64.exe; do
            for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll libgomp-1.dll; do
              if grep -qa "$dll" "$exe"; then echo "::error::$exe references $dll"; bad=1; fi
            done
          done
          exit "$bad"

      # If the app does not ask this fork's releases, it asks ollama.com and
      # replaces the install with a stock ollama.
      - name: the app updates from the fork
        working-directory: repo
        run: |
          grep -qa "repos/mann1x/xollama/releases" dist/windows-xollama-app-amd64.exe \
            || { echo "::error::the tray app does not name the fork's releases endpoint"; exit 1; }

      # build_windows.ps1's own steps, so the payload id and the installer
      # defines cannot drift from a local build.
      - name: build the installers
        shell: pwsh
        working-directory: repo
        run: |
          if (-not (Get-Item "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            & choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          $env:ARCH = 'amd64'
          & .\scripts\build_windows.ps1 installer installerUpdate
          foreach ($f in @('dist\xOllamaSetup.exe', 'dist\xOllamaUpdate.exe', 'dist\payload-id.txt')) {
            if (-not (Test-Path $f)) { throw "the installer steps did not produce $f" }
          }
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      # Both installers are RUN here, before anything is attached: the full
      # one, then the update-only one over it, which must accept the payload
      # the first laid down. v0.35.1-xollama shipped an update installer that
      # ended in a runtime error and v0.35.1-xollama.1 one that refused every
      # install; no step had ever started the file.
      - name: the installers install
        shell: pwsh
        working-directory: repo
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\xOllama"
          function runInstaller($exe, $name) {
            $log = "$env:RUNNER_TEMP\$name.log"
            $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "$name did not finish in 15 minutes" }
            if (Test-Path $log) { Get-Content $log -Tail 12 }
            if ($p.ExitCode -ne 0) { throw "$name exited $($p.ExitCode)" }
            "$name exited 0"
          }
          runInstaller (Resolve-Path dist\xOllamaSetup.exe).Path 'xOllamaSetup'
          $want = (Get-Content dist\payload-id.txt -Raw).Trim()
          $got = (Get-Content "$inst\lib\ollama\PAYLOAD_ID" -Raw).Trim()
          if ($got -cne $want) { throw "installed PAYLOAD_ID [$got] is not payload-id.txt [$want]" }
          $v = (& "$inst\xollama.exe" --version 2>&1 | Out-String)
          if ($v -notmatch [regex]::Escape($env:VERSION)) { throw "installed xollama says [$v], not $env:VERSION" }
          runInstaller (Resolve-Path dist\xOllamaUpdate.exe).Path 'xOllamaUpdate'
          $v = (& "$inst\xollama.exe" --version 2>&1 | Out-String)
          if ($v -notmatch [regex]::Escape($env:VERSION)) { throw "after the update xollama says [$v], not $env:VERSION" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$inst\xollama-stop.ps1" -App $inst
          "both installers ran; payload id $got"

      - name: attach to the draft
        working-directory: repo
        run: |
          cp dist/windows-amd64/xollama.exe xollama-windows-amd64.exe
          for f in dist/xOllamaSetup.exe dist/xOllamaUpdate.exe; do
            size=$(stat -c %s "$f")
            [ "$size" -lt 2147483648 ] || { echo "::error::$f is $size bytes, over GitHub's 2 GiB asset cap"; exit 1; }
          done
          gh release upload "$TAG" dist/xOllamaSetup.exe dist/xOllamaUpdate.exe dist/payload-id.txt \
            xollama-windows-amd64.exe --clobber

  linux:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    # Each architecture on a runner of its own kind: no emulation, and the
    # binary is run where it was built.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      ARCH: ${{ matrix.arch }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      GO_TOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
    steps:
      - name: clone
        run: |
          git init -q repo && cd repo
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q --detach FETCH_HEAD
      # Inside AlmaLinux 8, so the binary runs on glibc 2.28 and newer rather
      # than on the runner's 2.39 only. -ldl because dlopen only joined libc in 2.34.
      - name: build (inside almalinux 8)
        working-directory: repo
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION -e ARCH \
            -e CGO_ENABLED=1 -e CGO_LDFLAGS=-ldl -e GOTOOLCHAIN=local -e WANT="$GO_TOOLCHAIN" \
            almalinux:8 bash -euo pipefail -c '
              dnf install -y -q gcc gcc-c++ tar gzip findutils > /dev/null
              # arm64: clang, as upstream builds it. AlmaLinux 8 gcc has no
              # arm_bf16.h, which the MLX headers include.
              if [ "$ARCH" = arm64 ]; then dnf install -y -q clang > /dev/null; export CC=clang CXX=clang++; fi
              curl -fsSL "https://go.dev/dl/${WANT}.linux-${ARCH}.tar.gz" -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH=/usr/local/go/bin:$PATH
              ldflags="-s -w -X=github.com/ollama/ollama/version.Version=$VERSION -X=github.com/ollama/ollama/server.mode=release"
              go build -trimpath -ldflags "$ldflags" -o "xollama-linux-$ARCH" .
            '
          bin="xollama-linux-$ARCH"
          sudo chown "$(id -u):$(id -g)" "$bin"
          got=$(GOTOOLCHAIN=local go version "$bin" | awk '{print $NF}')
          echo "built with $got"
          [ "$got" = "$GO_TOOLCHAIN" ] || { echo "::error::built with $got, not $GO_TOOLCHAIN"; exit 1; }
          "./$bin" --version 2>&1 | tee version.txt
          grep -q "$VERSION" version.txt || { echo "::error::the binary does not report $VERSION"; exit 1; }
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: attach to the draft
        working-directory: repo
        run: gh release upload "$TAG" "xollama-linux-$ARCH" --clobber

  # The Apple silicon app, as scripts/build_darwin.sh builds it on the Mac
  # mini: runtime, opencoti engine from the pin, Developer ID signature,
  # notarization, DMG. A standard hosted runner (the repository is public).
  macos:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: macos-26
    # Three notarizations (the binary, the app, the DMG), each waited for.
    timeout-minutes: 300
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      GOTOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
    steps:
      - name: clone
        run: |
          git init -q repo && cd repo
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      # MLX's Metal 4 library needs the macOS 26 SDK and the Metal toolchain,
      # which Xcode 26 ships as a component of its own.
      - name: toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          if ! xcrun --find metal > /dev/null 2>&1; then
            echo "no Metal toolchain on this image; downloading the component"
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
          cmake --version | head -1
          go version
          node --version

      # A keychain of this run's own, under a password made here, first on the
      # search list so codesign finds the identity. The .p12 is removed as soon
      # as it is imported; the keychain goes in the last step.
      - name: signing keychain
        env:
          MACOS_SIGNING_KEY: ${{ secrets.MACOS_SIGNING_KEY }}
          MACOS_SIGNING_KEY_PASSWORD: ${{ secrets.MACOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MACOS_SIGNING_KEY" ] && [ -n "$MACOS_SIGNING_KEY_PASSWORD" ] \
            || { echo "::error::MACOS_SIGNING_KEY and MACOS_SIGNING_KEY_PASSWORD are not set in the repository's secrets"; exit 1; }
          K="$RUNNER_TEMP/xollama-build.keychain-db"
          P=$(openssl rand -hex 16)
          printf %s "$MACOS_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$P" "$K"
          security set-keychain-settings -lut 21600 "$K"
          security unlock-keychain -p "$P" "$K"
          security import "$RUNNER_TEMP/cert.p12" -k "$K" -P "$MACOS_SIGNING_KEY_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P" "$K" > /dev/null
          security list-keychains -d user -s "$K" $(security list-keychains -d user | tr -d '"')
          n=$(security find-identity -v -p codesigning "$K" | grep -c 'Developer ID Application' || true)
          [ "$n" = 1 ] || { echo "::error::the keychain holds $n Developer ID Application identities, expected 1"; exit 1; }
          echo "one Developer ID Application identity, valid for code signing"

      # build_darwin.sh's own steps, with the settings of the Mac mini's
      # build: no Finder styling of the DMG (it needs a logged-in desktop).
      - name: build, sign, notarize
        working-directory: repo
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_NOTARY_KEY_PEM: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_TIMEOUT: 60m
          VOL_NAME: xOllama
          XOLLAMA_DMG_HEADLESS: "1"
        run: |
          set -euo pipefail
          for v in APPLE_IDENTITY APPLE_NOTARY_KEY_PEM APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::$v is not set in the repository's secrets"; exit 1; }
          done
          umask 077
          printf '%s\n' "$APPLE_NOTARY_KEY_PEM" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          unset APPLE_NOTARY_KEY_PEM
          umask 022
          sh scripts/build_darwin.sh build sign app
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          ls -l dist/xOllama.dmg dist/xOllama-darwin.zip

      # What a Mac decides on when the file is opened, and what the app's own
      # updater decides on: both files, not only the one that was built last.
      - name: the app is signed, notarized and stapled
        working-directory: repo
        env:
          WANT: ${{ needs.plan.outputs.gotoolchain }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/xOllama.app
          spctl -a -vv dist/xOllama.app 2>&1 | tee spctl-app.txt
          grep -q 'source=Notarized Developer ID' spctl-app.txt || { echo "::error::Gatekeeper does not accept the app as notarized"; exit 1; }
          xcrun stapler validate dist/xOllama.app
          xcrun stapler validate dist/xOllama.dmg
          spctl -a -t open --context context:primary-signature -vv dist/xOllama.dmg 2>&1 | tee spctl-dmg.txt
          grep -q 'source=Notarized Developer ID' spctl-dmg.txt || { echo "::error::Gatekeeper does not accept the DMG as notarized"; exit 1; }
          # The zip is the only file the updater takes: the app inside it.
          mkdir unzipped && ditto -x -k dist/xOllama-darwin.zip unzipped
          xcrun stapler validate unzipped/xOllama.app
          codesign --verify --deep --strict unzipped/xOllama.app
          R=unzipped/xOllama.app/Contents
          "$R/Resources/xollama" --version 2>&1 | tee version.txt
          grep -q "$VERSION" version.txt || { echo "::error::the bundled xollama does not report $VERSION"; exit 1; }
          [ "$(plutil -extract CFBundleShortVersionString raw "$R/Info.plist")" = "$VERSION" ] \
            || { echo "::error::Info.plist does not carry $VERSION"; exit 1; }
          for exe in "$R/Resources/xollama" "$R/MacOS/xOllama"; do
            got=$(go version "$exe" | awk '{print $NF}')
            echo "$exe: $got"
            [ "$got" = "$WANT" ] || { echo "::error::$exe was built with $got, not $WANT"; exit 1; }
            lipo "$exe" -verify_arch arm64
          done
          # If the app does not ask this fork's releases, it asks ollama.com
          # and replaces the install with a stock ollama.
          grep -qa "repos/mann1x/xollama/releases" "$R/MacOS/xOllama" \
            || { echo "::error::the app does not name the fork's releases endpoint"; exit 1; }
          # The engine and its loader, as the pin names them for this platform.
          test -f "$R/Resources/engines/ape-macos-aarch64" || { echo "::error::no engine loader in the bundle"; exit 1; }
          codesign -d --entitlements - "$R/Resources/engines/ape-macos-aarch64" 2>/dev/null | grep -qa 'allow-unsigned-executable-memory' \
            || { echo "::error::the engine loader lost its entitlement; under the hardened runtime it is killed at start"; exit 1; }
          ls -l "$R/Resources/engines"

      - name: attach to the draft
        working-directory: repo
        run: |
          for f in dist/xOllama.dmg dist/xOllama-darwin.zip; do
            size=$(stat -f %z "$f")
            [ "$size" -lt 2147483648 ] || { echo "::error::$f is $size bytes, over GitHub's 2 GiB asset cap"; exit 1; }
          done
          gh release upload "$TAG" dist/xOllama.dmg dist/xOllama-darwin.zip --clobber

      - name: remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/xollama-build.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    needs: [plan, windows, linux, macos]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      PR: ${{ needs.plan.outputs.pr }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ needs.plan.outputs.mode }}
      KIND: ${{ needs.plan.outputs.kind }}
      UPSTREAM: ${{ needs.plan.outputs.upstream }}
      ENGINE: ${{ needs.plan.outputs.engine }}
      RUNTIME_TAG: ${{ needs.plan.outputs.runtime_tag }}
      LINUX_RUNTIME_TAG: ${{ needs.plan.outputs.linux_runtime_tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      GO_TOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
      GO_MOD: ${{ needs.plan.outputs.gomod }}
    steps:
      - name: verify the asset set
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" --clobber
          rm -f sha256sum.txt
          want=(payload-id.txt xOllama-darwin.zip xOllama.dmg xOllamaSetup.exe xOllamaUpdate.exe xollama-linux-amd64 xollama-linux-arm64 xollama-windows-amd64.exe)
          have=$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs)
          [ "$have" = "${want[*]}" ] || { echo "::error::assets are '$have', expected '${want[*]}'"; exit 1; }
          grep -Eqx '[0-9a-f]{64}' payload-id.txt || { echo "::error::payload-id.txt is not a sha256"; exit 1; }
          # The format app/updater/fork.go parses.
          sha256sum "${want[@]}" > sha256sum.txt
          cat sha256sum.txt
          gh release upload "$TAG" sha256sum.txt --clobber

      - name: notes
        run: |
          set -euo pipefail
          gh pr view "$PR" --json body --jq .body > notes.md
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" repo
          git -C repo fetch -q origin "$SHA"
          llama=$(git -C repo show "$SHA:LLAMA_CPP_VERSION" | tr -d '[:space:]')
          epin=$(git -C repo show "$SHA:llm/engine/pin/index.txt" | awk '$1=="engine" {n=split($2,a,"/"); print a[n]}')
          etag=$(git -C repo show "$SHA:llm/engine/pin/$epin" | awk '$1=="file" && $2=="any" && $3=="bin" {n=split($4,a,"/"); print a[n]; exit}')
          if [ "$ENGINE" = yes ]; then engine="opencoti-llamafile \`$etag\` on Windows and Linux"
          else engine="opencoti-llamafile \`$etag\` on Linux; **llama.cpp only on Windows** at this pin"; fi
          # Whether updating to this release takes the small installer: only when
          # the previous published release carried the same payload.
          id=$(cat assets/payload-id.txt)
          prev=$(gh release list --limit 20 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(rc\.[1-9][0-9]*\.xollama|xollama(\.[1-9][0-9]*)?)$' | grep -vx "$TAG" | sort -V | tail -1 || true)
          if [ -z "$prev" ]; then delta="first release: every install takes \`xOllamaSetup.exe\`"
          elif [ "$(gh release download "$prev" -p payload-id.txt -O - 2>/dev/null)" = "$id" ]; then
            delta="payload unchanged since $prev: updating from it downloads \`xOllamaUpdate.exe\` only"
          else delta="payload changed since $prev: updating from it downloads \`xOllamaSetup.exe\`"; fi
          echo "delta: $delta"
          {
            echo
            echo "---"
            echo "### Provenance"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$SHA\` |"
            echo "| upstream base | ollama v$UPSTREAM |"
            echo "| Go | \`$GO_TOOLCHAIN\` (go.mod: \`go $GO_MOD\`, upstream's line with its newest patch release) |"
            echo "| llama.cpp | \`$llama\`: CPU runtime \`$RUNTIME_TAG\`, CUDA 13 and Vulkan backends from upstream v$UPSTREAM |"
            echo "| engine | $engine |"
            echo "| macOS | \`xOllama.dmg\` (Apple silicon, Developer ID signed, notarized and stapled); \`xOllama-darwin.zip\` is what the app's updater takes |"
            echo "| Linux | \`xollama-linux-amd64\`, \`xollama-linux-arm64\` (glibc 2.28 and newer; the binary alone, no runtime) |"
            echo "| container image | \`mannixita/xollama:$VERSION\` and \`ghcr.io/mann1x/xollama:$VERSION\`, amd64 and arm64; CPU runtime \`mann1x/ollama $LINUX_RUNTIME_TAG\`. Built from this tag after the release is published |"
            echo "| payload id | \`$id\` |"
            echo "| update | $delta |"
            echo
            echo "The Windows installer is unsigned; SmartScreen warns on first run. Verify it against \`sha256sum.txt\`."
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      # Publishing the draft is what creates the tag, on $SHA.
      - name: publish as a pre-release
        if: env.MODE == 'release'
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          got=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" | cut -f1)
          [ "$got" = "$SHA" ] || { echo "::error::tag $TAG points at $got, not $SHA"; exit 1; }
          if [ "$KIND" = rc ]; then
            echo "published $TAG as a pre-release; a candidate is never promoted: after the test-host check, release v$UPSTREAM-xollama from the same tree"
          else
            echo "published $TAG as a pre-release; promote after the test-host check (RELEASE.md step 8)"
          fi

      # A tag made with GITHUB_TOKEN starts no workflow on its own, but a
      # workflow_dispatch does. The image reads the release's pre-release flag:
      # a pre-release moves :dev, never :latest. A failure here is a warning:
      # the release is out, and the image can be run by hand on the tag.
      - name: start the container image
        if: env.MODE == 'release'
        run: |
          gh workflow run docker-release.yaml --ref "$TAG" \
            || echo "::warning::could not start docker-release.yaml on $TAG; run it by hand: gh workflow run docker-release.yaml --ref $TAG"

      - name: dry run
        if: env.MODE == 'draft'
        run: echo "draft $TAG is ready; install it on the test host, then delete it (RELEASE.md step 3)"
