name: test-install

on:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/test-install.yaml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run install script
        run: sh ./scripts/install.sh
        env:
          OLLAMA_NO_START: 1 # do not start app
      - name: Verify ollama is available
        # xollama-hook: install-check -- the fork's install.sh installs xollama, from the Latest release's tarballs (docs/protocols/RELEASE.md)
        run: xollama --version
