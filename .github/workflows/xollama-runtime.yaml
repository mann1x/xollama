# Builds the Windows CPU runtime (llama-server.exe and the CPU ggml DLLs) ONCE
# and publishes it as a pinned artifact that releases download, instead of
# rebuilding it in every release. Procedure: docs/protocols/RELEASE.md,
# "Moving the runtime pin".
#
# Why: the build is not byte-reproducible, so a runtime rebuilt per release
# gave every release a new payload id, and the updater could never choose the
# small xOllamaUpdate.exe. Measured: two dry runs whose second commit changed
# only Go code produced payload ids 213e5a… and cd3148…. A pinned runtime makes
# the payload a function of three pins -- this one, upstream's GPU backends,
# and llm/engine/pin.txt -- so it changes only when one of them moves.
#
# The release tag carries a digest of exactly the files that decide what gets
# built (LLAMA_CPP_VERSION, llama/server, llama/compat). xollama-release.yaml
# recomputes it at the release commit and refuses to ship when the pin no
# longer matches, so a llama/compat change cannot reach a release on a stale
# runtime.
#
# The release this creates is marked pre-release and is never "latest"; its tag
# is not semver, so app/updater/fork.go never offers it to anyone.
name: xollama runtime

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build the runtime from'
        default: dev
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        env:
          REF: ${{ inputs.ref }}
        run: |
          # LF, not CRLF: llama/compat/*.patch are LF and `git apply` will not
          # match them against a CRLF checkout.
          git init -q repo && cd repo
          git config core.autocrlf false && git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$REF" && git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      - name: name the runtime
        id: name
        working-directory: repo
        run: |
          # The same computation xollama-release.yaml's plan job runs; keep them identical.
          inputs=$(git ls-tree -r HEAD -- LLAMA_CPP_VERSION llama/server llama/compat | sha256sum | cut -c1-64)
          llama=$(tr -d '[:space:]' < LLAMA_CPP_VERSION)
          tag="runtime-windows-amd64-${llama}-${inputs:0:12}"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          echo "llama=$llama" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag is already published; these inputs are pinned already (see llama/runtime-pin.txt)"
            exit 1
          fi
          echo "building $tag"

      - name: install the clang64 toolchain
        shell: pwsh
        run: |
          # The shipped CPU DLLs are MSYS2 clang64 builds (libc++.dll and
          # libunwind.dll are the tell); match them, not the MSVC runtime.
          & C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-clang-x86_64-clang
          & C:\msys64\clang64\bin\clang.exe --version | Select-Object -First 1 | Tee-Object -FilePath clang-version.txt

      - name: build the CPU runtime
        shell: pwsh
        working-directory: repo
        run: |
          # Native CMake and its ninja: MSYS2's cmake takes POSIX paths only.
          $env:PATH = "C:\Program Files\CMake\bin;C:\msys64\clang64\bin;$env:PATH"
          $env:CC  = 'C:/msys64/clang64/bin/clang.exe'
          $env:CXX = 'C:/msys64/clang64/bin/clang++.exe'
          $env:CMAKE_GENERATOR = 'Ninja'
          $dist = Join-Path $PWD 'dist'
          # GGML_CCACHE picks up MSYS2's ccache, which cannot resolve a
          # Windows-path compiler.
          & cmake -S llama/server --preset cpu_windows -DGGML_CCACHE=OFF --install-prefix $dist
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          # The compat patches must have reached the fetched source.
          $rb = 'build/llama-server-cpu/_deps/llama_cpp-src/common/reasoning-budget.cpp'
          foreach ($needle in @('WAITING_BOUNDARY', 'REASONING_BUDGET_SCOPE_RESPONSE', 'forced_end_pos')) {
            if (-not (Select-String -Path $rb -Pattern $needle -Quiet)) { throw "compat patch did not bring $needle into $rb" }
            Write-Output "patch applied: $needle present"
          }
          & cmake --build build/llama-server-cpu --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & cmake --install build/llama-server-cpu --component llama-server --strip
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          & "$dist\lib\ollama\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe does not run" }

      - name: package
        shell: pwsh
        working-directory: repo
        run: |
          # The archive root is lib/ollama's contents, so a release extracts it
          # straight into dist\windows-amd64\lib\ollama.
          Get-ChildItem dist/lib/ollama -Recurse -File | ForEach-Object { "{0}  {1:N1} MB" -f $_.FullName.Substring((Resolve-Path dist/lib/ollama).Path.Length + 1), ($_.Length/1MB) }
          Compress-Archive -Path dist/lib/ollama/* -DestinationPath xollama-runtime-windows-amd64.zip -Force

      - name: publish
        working-directory: repo
        env:
          TAG: ${{ steps.name.outputs.tag }}
          INPUTS: ${{ steps.name.outputs.inputs }}
          LLAMA: ${{ steps.name.outputs.llama }}
          SHA: ${{ steps.name.outputs.sha }}
        run: |
          set -euo pipefail
          zip=xollama-runtime-windows-amd64.zip
          sum=$(sha256sum "$zip" | cut -c1-64)
          {
            echo "The Windows CPU runtime xOllama releases are built with: \`llama-server.exe\` and the CPU \`ggml\` DLLs, MSYS2 clang64 ($(cat ../clang-version.txt | tr -d '\r'))."
            echo
            echo "**Not an xOllama release.** Nothing installs this directly; \`xollama-release.yaml\` downloads it by the pin in \`llama/runtime-pin.txt\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| built from | \`$SHA\` |"
            echo "| llama.cpp | \`$LLAMA\` |"
            echo "| inputs digest | \`$INPUTS\` (LLAMA_CPP_VERSION, llama/server, llama/compat) |"
            echo "| \`$zip\` sha256 | \`$sum\` |"
          } > notes.md
          gh release create "$TAG" "$zip" --target "$SHA" --prerelease --latest=false \
            --title "Windows CPU runtime $LLAMA (${INPUTS:0:12})" --notes-file notes.md
          pin="tag      $TAG
          asset    $zip
          sha256   $sum
          inputs   $INPUTS"
          {
            echo "### Pin it"
            echo
            echo "Replace the directives in \`llama/runtime-pin.txt\` with:"
            echo
            echo '```'
            echo "$pin" | sed 's/^ *//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$pin" | sed 's/^ *//'
