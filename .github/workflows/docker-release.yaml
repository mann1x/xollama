# Publish the xollama container image.
#
# ADDITIVE and fork-only. Upstream's release.yaml carries its own Docker
# pipeline, which compiles every native piece on upstream's self-hosted runners
# and caches against a registry only upstream can write to; this file does not
# touch it, so it never conflicts on `git merge upstream/main`.
#
# NOTHING NATIVE IS COMPILED HERE. Every native piece already exists as a
# published, sha256-pinned artifact, so the image is ASSEMBLED on a
# GitHub-hosted runner (plans/docker-image.md):
#
#   llama.cpp CPU runtime  the fork's release tgz        llama/runtime-pin-linux.txt
#   CUDA / Vulkan / MLX    upstream's release tarballs   llama/runtime-pin-linux.txt
#   opencoti engine        HF, whatever the pin names    llm/engine/pin.txt
#   xollama                Go-only build, AlmaLinux 8    this commit
#
# scripts/docker-assemble.sh does the assembly and is the same script used to
# validate it locally; Dockerfile.xollama is the runtime layer. New engine bytes
# reach the image through a pin move, not a CI change.
#
# CHANNELS. `:dev` is the only thing a branch build can move. `:latest` moves
# only from a tag whose GitHub release is a full release -- the pre-release
# flag decides, as it does for the desktop updater, not the hyphen in the tag
# (every `v<upstream>-xollama.<n>` tag has one). A release created by
# xollama-release.yaml with GITHUB_TOKEN triggers no workflow, so the image for
# a release is a manual run on its tag: `gh workflow run docker-release.yaml
# --ref v0.34.2-xollama.2`.
#
# amd64 only, for now (plans/docker-image.md); arm64 follows user testing.

name: docker-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image (off = assemble, build and smoke-test only)'
        required: true
        default: true
        type: boolean
      version:
        description: 'Version to tag, without the leading v (default: the tag, or <upstream>-dev.<sha> on a branch)'
        required: false
        type: string
      channel:
        description: 'auto = the GitHub pre-release flag on a tag, dev on a branch'
        required: false
        default: auto
        type: choice
        options: [auto, release, dev]

# A half-pushed set of tags is worse than a queued one.
concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ghcr.io/mann1x/xollama -- github.repository is already <owner>/<repo>.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # The Docker Hub namespace is the account's, not the repository's.
  DOCKERHUB_IMAGE: docker.io/mannixita/xollama
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      environment: ${{ steps.plan.outputs.environment }}
      moving_tag: ${{ steps.plan.outputs.moving_tag }}
      gotoolchain: ${{ steps.plan.outputs.gotoolchain }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          fail() { echo "::error::$*"; exit 1; }

          upstream=$(awk '$1=="upstream" {print $2}' llama/runtime-pin-linux.txt)
          if [ -n "${INPUT_VERSION:-}" ]; then
            version=$INPUT_VERSION
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="${upstream#v}-dev.$(git rev-parse --short=8 HEAD)"
          fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || fail "'$version' is not a valid image tag"

          # The channel: the release's pre-release flag on a tag, dev anywhere
          # else. :latest is never moved from a branch, whatever was asked.
          prerelease=true
          if [ "$GITHUB_REF_TYPE" = tag ] \
              && flag=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease,isDraft \
                          --jq 'if .isDraft then "draft" else (.isPrerelease|tostring) end' 2> /dev/null); then
            [ "$flag" = false ] && prerelease=false
          fi
          case "${INPUT_CHANNEL:-auto}" in
            dev) prerelease=true ;;
            release)
              [ "$GITHUB_REF_TYPE" = tag ] || fail "the release channel moves :latest and needs a tag ref, not $GITHUB_REF_NAME"
              prerelease=false ;;
          esac
          if [ "$prerelease" = true ]; then
            out environment dev; out moving_tag dev
          else
            out environment release; out moving_tag latest
          fi
          out version "$version"

          # The Go toolchain, as xollama-release.yaml picks it: upstream's line
          # from go.mod, the newest patch on it. Never GOTOOLCHAIN=auto.
          gomod=$(awk '$1=="go" {print $2; exit}' go.mod)
          line=$(cut -d. -f1,2 <<< "$gomod")
          toolchain=$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' \
            | jq -r --arg l "go$line" '[.[] | select(.stable) | .version | select(. == $l or startswith($l + "."))] | first // empty')
          [ -n "$toolchain" ] || fail "no stable Go release found on the go$line line (go.mod says go $gomod)"
          out gotoolchain "$toolchain"

          echo "image $version, channel $( [ "$prerelease" = true ] && echo dev || echo release ), Go $toolchain"

  build:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GO_TOOLCHAIN: ${{ needs.plan.outputs.gotoolchain }}
      MOVING_TAG: ${{ needs.plan.outputs.moving_tag }}
    steps:
      - uses: actions/checkout@v4

      # The fork commit the runtime was built at, trees only, so the assembly
      # can prove the pin's inputs digest against it and not just trust it.
      - name: fetch the runtime's provenance
        run: |
          built=$(awk '$1=="built" {print $2}' llama/runtime-pin-linux.txt)
          git fetch -q --depth 1 --filter=blob:none https://github.com/mann1x/ollama "$built"

      # The payload is ~5.5 GB unpacked, the image as much again; the runner
      # starts with about 20 GB free. Tools this job never uses go first.
      - name: make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /

      - name: assemble
        run: |
          ASSET_DIR="$RUNNER_TEMP/assets" scripts/docker-assemble.sh "$RUNNER_TEMP/ctx"
          rm -rf "$RUNNER_TEMP/assets"

      - name: build
        run: |
          docker build -t "xollama:$VERSION" "$RUNNER_TEMP/ctx"
          rm -rf "$RUNNER_TEMP/ctx"
          docker image ls "xollama:$VERSION"

      # Serve on the image's own XOLLAMA_HOST and ask it who it is. A server
      # bound to the container's loopback -- what upstream's OLLAMA_HOST would
      # have produced -- fails here rather than in a user's hands.
      - name: smoke
        run: |
          docker run -d --name smoke -p 127.0.0.1:22434:22434 "xollama:$VERSION"
          for _ in $(seq 1 30); do
            got=$(curl -fsS --max-time 2 http://127.0.0.1:22434/api/xollama 2> /dev/null) && break
            sleep 1
          done
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke > /dev/null
          echo "${got:-no answer}"
          [ "$(jq -r .version <<< "${got:-null}" 2> /dev/null)" = "$VERSION" ] \
            || { echo "::error::the image did not answer /api/xollama as $VERSION"; exit 1; }

      - name: Log in to GHCR
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :<version>, :<version>-amd64 (so a later multi-arch manifest can be
      # assembled from it), and the channel's moving tag -- :dev or :latest,
      # never both.
      - name: push
        if: inputs.push != false
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "$VERSION" "$VERSION-amd64" "$MOVING_TAG"; do
              docker tag "xollama:$VERSION" "$image:$tag"
              docker push -q "$image:$tag"
            done
          done
